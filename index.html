<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>AFTERSHOCKS Response</title>
<meta name="description" content="เกมวางแผนกู้ภัยแผ่นดินไหว — ส่งเจ้าหน้าที่ 4 คนช่วยผู้รอดชีวิต 1,200 คน ใน 72 ชั่วโมง">

<!-- สีแถบบนของเบราว์เซอร์มือถือ ให้กลืนกับพื้นเกม ไม่มีแถบขาวโผล่ข้างบน -->
<meta name="theme-color" content="#04070f">
<!-- เพิ่มลงหน้าจอโฮมแล้วเปิดแบบเต็มจอ ไม่มีแถบ URL มาแย่งพื้นที่ (จอเตี้ยอยู่แล้ว) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AFTERSHOCKS">

<!-- ไอคอนแท็บ วาดเป็น SVG ฝังในบรรทัดเดียว ไม่ต้องมีไฟล์แยก -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1226'/%3E%3Cpath d='M4 21l5-9 4 6 3-5 4 8 3-4 5 4' fill='none' stroke='%2345d0ff' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <!-- ทุกหน้าจอ (ปก → เมนู → tutorial → เกมหลัก → result) วาดลงใน div เดียวนี้ -->
  <div id="screen-root" class="screen-overlay"></div>

  <!--
    เกมบังคับแนวนอน — ถือมือถือแนวตั้งแล้วเล่นไม่ได้จริง ๆ (ชื่อเกมโดนตัด แถบ จนท. ไม่ขึ้น)
    หน้านี้เป็น HTML นิ่ง ๆ ไม่ผ่าน JS เพื่อให้ขึ้นได้ทันทีตั้งแต่ยังโหลดโค้ดไม่เสร็จ
    ซ่อน/แสดงด้วย @media (orientation: portrait) ที่ styles.css อย่างเดียว
  -->
  <div class="rotate-gate" aria-hidden="true">
    <svg class="rotate-phone" viewBox="0 0 120 120" aria-hidden="true">
      <rect class="rotate-body" x="41" y="14" width="38" height="66" rx="6"/>
      <line class="rotate-speaker" x1="54" y1="23" x2="66" y2="23"/>
      <path class="rotate-arrow" d="M26 92a40 40 0 0 0 68 0"/>
      <path class="rotate-head" d="M88 84l8 10-12 3z"/>
    </svg>
    <div class="rotate-title">หมุนจอเป็นแนวนอน</div>
    <div class="rotate-note">เกมนี้เล่นแนวนอนอย่างเดียว</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
